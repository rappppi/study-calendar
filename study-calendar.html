<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勉強カレンダー</title>
<style>
:root{--ink:#65586d;--line:#f0e5ee;--bg:#fffafd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:600px;margin:auto;padding:22px 15px}header,.bar,.nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:23px;margin:0}small,.hint{color:#a497a9}.bar{margin:22px 0 12px}.month{font-size:22px;font-weight:bold}.season{font-size:26px;margin-left:8px}.nav button,button{border:1px solid var(--line);background:white;border-radius:12px;padding:10px;color:inherit}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:#a497a9;font-size:12px;padding:7px}.day{height:72px;text-align:left;vertical-align:top;padding:7px 5px!important;border-radius:12px!important}.day.sel{outline:2px solid #c7b1df}.day .mins{display:block;font-size:10px;margin-top:8px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:16px}.primary{background:#c9b4df;color:white;border:0;font-weight:bold}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f5edf3}input,select{padding:10px;border:1px solid var(--line);border-radius:10px;max-width:100%}.modal{position:fixed;inset:0;background:#34283b66;display:flex;align-items:end;padding:12px}.sheet{background:#fffafd;border-radius:20px;padding:18px;width:100%;max-width:580px;margin:auto;max-height:85vh;overflow:auto}.hide{display:none}.total{font-size:24px;font-weight:bold;color:#9b7dbb}
</style>
<main>
<header><div><h1>勉強カレンダー</h1><small>今日のがんばりを、少しずつ。</small></div><button id="subjects">教科設定</button></header>
<div class="bar"><div><span class="month" id="month"></span><span class="season" id="season"></span></div><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div>
<div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="grid" id="grid"></div>
<p class="hint">勉強時間が長い日ほど、色が少し濃くなるよ。</p>
<section class="panel"><small>今月の勉強時間</small><div class="total" id="monthTotal">0分</div><div class="actions"><button class="primary" id="today">今日の勉強を記録</button><button id="stats">教科別の合計</button></div></section>
<section class="panel"><b id="dateTitle">日付を選んでね</b><p class="hint" id="summary">カレンダーの日付をタップすると、その日の記録が見られるよ。</p><div id="details"></div><button class="primary" id="add">この日に記録を追加</button></section>
<p class="hint" style="text-align:center;font-size:11px">記録はこのブラウザに保存されます。</p></main>
<div class="modal hide" id="modal"><div class="sheet"><div class="actions"><b id="modalTitle"></b><button id="close">閉じる</button></div><div id="content"></div></div></div>
<script>
const $=x=>document.getElementById(x),now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1),sel=key(now),data=JSON.parse(localStorage.studyRecords||'{}'),subs=JSON.parse(localStorage.studySubjects||'["国語","数学","英語","理科","社会"]');
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function total(k){return(data[k]||[]).reduce((a,r)=>a+ +r.m,0)}function fmt(n){return n>=60?Math.floor(n/60)+'時間'+(n%60?n%60+'分':''):n+'分'}function save(){localStorage.studyRecords=JSON.stringify(data);localStorage.studySubjects=JSON.stringify(subs)}
function draw(){let y=view.getFullYear(),m=view.getMonth()+1,first=new Date(y,m-1,1).getDay(),last=new Date(y,m,0).getDate();$('month').textContent=y+'年'+m+'月';$('season').textContent=[3,4,5].includes(m)?'✿':([6,7,8].includes(m)?'❀':([9,10,11].includes(m)?'🍂':'❄︎'));let h='';for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=last;d++){let k=key(new Date(y,m-1,d)),v=total(k),bg=v===0?'white':v<30?'#fbf1f7':v<60?'#f5e3f0':v<120?'#edd7ed':'#dfc7e8';h+=`<button class="day ${k===sel?'sel':''}" data-k="${k}" style="background:${bg}">${d}${v?`<span class="mins">${fmt(v)}</span>`:''}</button>`}$('grid').innerHTML=h;document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sel=b.dataset.k;draw()});let sum=Object.keys(data).filter(k=>k.startsWith(y+'-'+String(m).padStart(2,'0'))).reduce((a,k)=>a+total(k),0);$('monthTotal').textContent=fmt(sum);detail()}
function detail(){let a=data[sel]||[];$('dateTitle').textContent=Number(sel.slice(-2))+'日の記録';$('summary').textContent=a.length?'合計 '+fmt(total(sel)):'まだ記録がないよ。';$('details').innerHTML=a.map((r,i)=>`<div class="row"><span>${r.s}</span><b>${fmt(+r.m)}</b><button data-del="${i}">削除</button></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.del,1);save();draw()})}
function modal(t,html){$('modalTitle').textContent=t;$('content').innerHTML=html;$('modal').classList.remove('hide')}
function add(){modal('勉強を記録',`<p>教科</p><select id="s">${subs.map(s=>`<option>${s}</option>`).join('')}</select><p>勉強時間（分）</p><input id="m" type="number" min="1" placeholder="例：30"><p><button class="primary" id="save">保存する</button></p><small>記録する日：${sel}</small>`);$('save').onclick=()=>{let m=+$('m').value;if(m<1)return alert('勉強時間を入力してね');(data[sel]??=[]).push({s:$('s').value,m});save();$('modal').classList.add('hide');draw()}}
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);draw()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);draw()};$('today').onclick=()=>{sel=key(now);view=new Date(now.getFullYear(),now.getMonth(),1);draw();add()};$('add').onclick=add;$('close').onclick=()=>$('modal').classList.add('hide');$('stats').onclick=()=>{let t={};Object.values(data).flat().forEach(r=>t[r.s]=(t[r.s]||0)+ +r.m);modal('教科別の合計',Object.entries(t).map(([s,m])=>`<div class="row">${s}<b>${fmt(m)}</b></div>`).join('')||'まだ記録がないよ。')};
$('subjects').onclick=()=>{modal('教科設定',subs.map((s,i)=>`<div class="row">${s}<button data-rm="${i}">削除</button></div>`).join('')+'<p><input id="newsub" placeholder="新しい教科"><button class="primary" id="addsub">追加</button></p>');document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{subs.splice(+b.dataset.rm,1);save();$('subjects').click()});$('addsub').onclick=()=>{let s=$('newsub').value.trim();if(s&&!subs.includes(s)){subs.push(s);save();$('subjects').click()}}};draw();
</script>
